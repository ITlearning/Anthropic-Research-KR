<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Persona vector extraction pipeline</title>
  <desc id="desc">A Korean reconstruction showing prompt generation, trait-positive and trait-negative responses, and extraction of a persona vector from activation differences.</desc>
  <rect width="1400" height="860" fill="#f7f4fb"/>
  <rect x="48" y="48" width="1304" height="764" rx="34" fill="#ffffff" stroke="#ddd6e8"/>
  <text x="88" y="108" font-family="Georgia, serif" font-size="38" fill="#232323">Automated extraction of a persona vector</text>
  <text x="88" y="144" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#625d67">Trait prompts are generated automatically, then contrasted inside the model.</text>

  <rect x="96" y="202" width="286" height="500" rx="28" fill="#fbfafc" stroke="#ebe6f1"/>
  <text x="128" y="244" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2d2a34">Trait + description</text>
  <rect x="128" y="284" width="222" height="78" rx="20" fill="#ffe8e3"/>
  <text x="156" y="326" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#a34c33">evil</text>
  <text x="156" y="350" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7c4a3a">acts unethically or harmfully</text>
  <rect x="128" y="400" width="222" height="214" rx="22" fill="#f4f7fb" stroke="#dce6f3"/>
  <text x="150" y="438" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f5c85">Prompt generator</text>
  <text x="150" y="474" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5e6c7a">Create matched prompts that</text>
  <text x="150" y="500" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5e6c7a">encourage opposite behaviors.</text>
  <text x="150" y="552" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5e6c7a">same task</text>
  <text x="150" y="578" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5e6c7a">different persona expression</text>

  <rect x="438" y="202" width="368" height="500" rx="28" fill="#fbfafc" stroke="#ebe6f1"/>
  <text x="470" y="244" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2d2a34">Trait-positive vs trait-negative</text>
  <rect x="470" y="284" width="304" height="154" rx="22" fill="#fff0ea" stroke="#f0d3c6"/>
  <text x="494" y="322" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#a34c33">response exhibits evil</text>
  <rect x="494" y="346" width="250" height="18" rx="9" fill="#efb49d"/>
  <rect x="494" y="378" width="226" height="18" rx="9" fill="#efb49d"/>
  <rect x="494" y="410" width="190" height="18" rx="9" fill="#efb49d"/>
  <rect x="470" y="472" width="304" height="154" rx="22" fill="#edf4fb" stroke="#dce6f3"/>
  <text x="494" y="510" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#35658f">response avoids evil</text>
  <rect x="494" y="534" width="250" height="18" rx="9" fill="#bdd6ee"/>
  <rect x="494" y="566" width="232" height="18" rx="9" fill="#bdd6ee"/>
  <rect x="494" y="598" width="210" height="18" rx="9" fill="#bdd6ee"/>

  <rect x="862" y="202" width="216" height="500" rx="28" fill="#fbfafc" stroke="#ebe6f1"/>
  <text x="892" y="244" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2d2a34">Activation diff</text>
  <rect x="902" y="292" width="136" height="308" rx="24" fill="#f3f7fb" stroke="#dce6f3"/>
  <circle cx="942" cy="342" r="13" fill="#d97349"/>
  <circle cx="996" cy="330" r="13" fill="#6fa8d8"/>
  <circle cx="966" cy="382" r="13" fill="#85bb6b"/>
  <circle cx="930" cy="420" r="13" fill="#6fa8d8"/>
  <circle cx="1002" cy="446" r="13" fill="#d98967"/>
  <circle cx="960" cy="494" r="13" fill="#7eafd8"/>
  <path d="M930 560 C954 520 984 524 1010 476" fill="none" stroke="#233a53" stroke-width="6" stroke-linecap="round"/>
  <text x="914" y="634" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5f7083">persona vector</text>

  <rect x="1134" y="202" width="170" height="500" rx="28" fill="#fbfafc" stroke="#ebe6f1"/>
  <text x="1162" y="244" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#2d2a34">Validate</text>
  <rect x="1162" y="306" width="114" height="60" rx="18" fill="#eef8e7"/>
  <text x="1184" y="343" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#4c7a48">steer</text>
  <rect x="1162" y="392" width="114" height="60" rx="18" fill="#edf4fb"/>
  <text x="1182" y="429" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#35658f">measure</text>
  <rect x="1162" y="478" width="114" height="60" rx="18" fill="#fff1e8"/>
  <text x="1186" y="515" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#a34c33">audit</text>

  <path d="M382 452 H436" stroke="#2f5c85" stroke-width="6" stroke-linecap="round"/>
  <path d="M420 440 l18 12 -18 12" fill="none" stroke="#2f5c85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M806 452 H860" stroke="#2f5c85" stroke-width="6" stroke-linecap="round"/>
  <path d="M844 440 l18 12 -18 12" fill="none" stroke="#2f5c85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1078 452 H1132" stroke="#2f5c85" stroke-width="6" stroke-linecap="round"/>
  <path d="M1116 440 l18 12 -18 12" fill="none" stroke="#2f5c85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
