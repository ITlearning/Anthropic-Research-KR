<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Inference-time steering versus preventative steering</title>
  <desc id="desc">A Korean reconstruction comparing post-hoc steering against a bad trait with preventative steering during finetuning, highlighting capability preservation.</desc>
  <rect width="1400" height="860" fill="#f7f4fb"/>
  <rect x="48" y="48" width="1304" height="764" rx="34" fill="#ffffff" stroke="#ddd6e8"/>
  <text x="88" y="108" font-family="Georgia, serif" font-size="38" fill="#232323">Prevent bad traits during training, not only after training</text>
  <text x="88" y="144" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#625d67">The article contrasts post-hoc trait suppression with preventative steering during finetuning.</text>

  <rect x="88" y="214" width="566" height="520" rx="28" fill="#fbfafc" stroke="#ebe6f1"/>
  <text x="122" y="258" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#a34c33">Inference-time steering after finetuning</text>
  <rect x="122" y="300" width="498" height="360" rx="24" fill="#f8fafc" stroke="#dfe5ed"/>
  <path d="M164 618 H576" stroke="#9da8b5" stroke-width="2"/>
  <path d="M208 354 V618" stroke="#9da8b5" stroke-width="2"/>
  <rect x="244" y="430" width="78" height="188" rx="18" fill="#d97349"/>
  <rect x="354" y="502" width="78" height="116" rx="18" fill="#f3b499"/>
  <rect x="464" y="392" width="78" height="226" rx="18" fill="#cfd5dc"/>
  <path d="M208 410 C292 382 392 394 542 462" fill="none" stroke="#7a828a" stroke-width="5" stroke-linecap="round"/>
  <text x="238" y="654" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#67616d">before</text>
  <text x="352" y="654" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#67616d">steered against</text>
  <text x="470" y="654" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#67616d">MMLU</text>
  <text x="162" y="686" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#67616d">Trait expression falls, but capability can drop.</text>

  <rect x="746" y="214" width="566" height="520" rx="28" fill="#fbfafc" stroke="#ebe6f1"/>
  <text x="780" y="258" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#4c7a48">Preventative steering during finetuning</text>
  <rect x="780" y="300" width="498" height="360" rx="24" fill="#f8fafc" stroke="#dfe5ed"/>
  <path d="M822 618 H1234" stroke="#9da8b5" stroke-width="2"/>
  <path d="M866 354 V618" stroke="#9da8b5" stroke-width="2"/>
  <rect x="902" y="446" width="78" height="172" rx="18" fill="#85bb6b"/>
  <rect x="1012" y="474" width="78" height="144" rx="18" fill="#c7deaa"/>
  <rect x="1122" y="378" width="78" height="240" rx="18" fill="#cfd5dc"/>
  <path d="M866 394 C948 388 1052 392 1200 402" fill="none" stroke="#7a828a" stroke-width="5" stroke-linecap="round"/>
  <text x="896" y="654" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#67616d">bad data</text>
  <text x="1010" y="654" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#67616d">preventative steer</text>
  <text x="1128" y="654" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#67616d">MMLU</text>
  <text x="820" y="686" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#67616d">Trait shift is limited while capability is preserved.</text>
</svg>
