<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Harmful compliance and distance from the Assistant</title>
  <desc id="desc">A Korean reconstruction of a scatter plot showing that personas farther from the Assistant are more likely to comply with harmful prompts.</desc>
  <rect width="1400" height="820" fill="#f8f5fb"/>
  <rect x="56" y="56" width="1288" height="708" rx="34" fill="#ffffff" stroke="#ddd6e8"/>
  <text x="96" y="116" font-family="Georgia, serif" font-size="38" fill="#212121">Some distant personas comply with harmful requests</text>
  <text x="96" y="152" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#615d67">Personas near the Assistant rarely do; personas farther away sometimes respond at substantial rates.</text>
  <rect x="132" y="210" width="1090" height="470" rx="30" fill="#fbfafc" stroke="#ebe6f1"/>
  <path d="M208 638 H1174" stroke="#9aa7b5" stroke-width="2"/>
  <path d="M244 638 V250" stroke="#9aa7b5" stroke-width="2"/>
  <line x1="244" y1="560" x2="1174" y2="560" stroke="#ebe6f1"/>
  <line x1="244" y1="482" x2="1174" y2="482" stroke="#ebe6f1"/>
  <line x1="244" y1="404" x2="1174" y2="404" stroke="#ebe6f1"/>
  <line x1="244" y1="326" x2="1174" y2="326" stroke="#ebe6f1"/>
  <text x="140" y="646" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5f5b66">near Assistant</text>
  <text x="1058" y="646" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5f5b66">far from Assistant</text>
  <text x="168" y="274" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5f5b66">50%</text>
  <text x="168" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5f5b66">40%</text>
  <text x="168" y="430" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5f5b66">30%</text>
  <text x="168" y="508" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5f5b66">20%</text>
  <text x="168" y="586" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5f5b66">10%</text>
  <text x="168" y="646" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5f5b66">0%</text>
  <text x="114" y="290" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5f5b66">harmful</text>
  <text x="114" y="314" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5f5b66">compliance</text>

  <path d="M280 612 C430 582 560 536 700 470 S990 338 1148 286" stroke="#b1775e" stroke-width="6" fill="none" stroke-dasharray="10 10"/>

  <circle cx="318" cy="600" r="13" fill="#5e9fd4"/>
  <circle cx="366" cy="588" r="13" fill="#6dacd8"/>
  <circle cx="424" cy="576" r="13" fill="#88bed9"/>
  <circle cx="488" cy="552" r="13" fill="#abc9dd"/>
  <circle cx="560" cy="524" r="13" fill="#d2c3bb"/>
  <circle cx="666" cy="450" r="13" fill="#e4a07d"/>
  <circle cx="772" cy="416" r="13" fill="#df875f"/>
  <circle cx="842" cy="344" r="13" fill="#d86e43"/>
  <circle cx="960" cy="304" r="13" fill="#d2633d"/>
  <circle cx="1048" cy="336" r="13" fill="#d97248"/>
  <circle cx="1110" cy="274" r="13" fill="#cb623c"/>

  <text x="340" y="604" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f5c85">assistant</text>
  <text x="388" y="592" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f5c85">analyst</text>
  <text x="446" y="580" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2f5c85">consultant</text>
  <text x="508" y="556" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#4f6174">generalist</text>
  <text x="580" y="528" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6f625c">coach</text>
  <text x="686" y="454" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8d553f">oracle</text>
  <text x="792" y="420" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8d553f">mystic</text>
  <text x="862" y="348" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8d553f">bohemian</text>
  <text x="980" y="308" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8d553f">ghost</text>
  <text x="1068" y="340" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8d553f">hermit</text>
  <text x="1128" y="278" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8d553f">leviathan</text>
</svg>
