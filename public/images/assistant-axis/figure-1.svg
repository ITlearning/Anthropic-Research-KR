<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Assistant Axis persona space</title>
  <desc id="desc">A Korean reconstruction of the persona space figure, showing Assistant-aligned archetypes versus non-assistant archetypes, and similarity between base and post-trained axes.</desc>
  <rect width="1400" height="860" fill="#f7f4fb"/>
  <rect x="48" y="48" width="820" height="764" rx="34" fill="#ffffff" stroke="#ddd6e8"/>
  <rect x="908" y="48" width="444" height="764" rx="34" fill="#ffffff" stroke="#ddd6e8"/>
  <text x="86" y="102" font-family="Georgia, serif" font-size="36" fill="#212121">Persona space in Llama 3.3 70B</text>
  <text x="944" y="102" font-family="Georgia, serif" font-size="36" fill="#212121">Base vs post-training</text>
  <text x="86" y="138" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#615d67">Role vectors are colored by cosine similarity with the Assistant Axis.</text>
  <text x="944" y="138" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#615d67">The dominant direction appears before and after post-training.</text>

  <rect x="92" y="184" width="734" height="566" rx="28" fill="#fbfafc" stroke="#ebe6f1"/>
  <path d="M166 664 L650 254" stroke="#283d63" stroke-width="7" stroke-linecap="round"/>
  <path d="M634 246 l28 10 -20 20" fill="none" stroke="#283d63" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="236" y="694" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#283d63">Assistant Axis</text>
  <text x="632" y="228" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#283d63">more Assistant-like</text>
  <text x="126" y="708" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9a5a42">less Assistant-like</text>

  <circle cx="616" cy="292" r="14" fill="#5e9fd4"/>
  <circle cx="560" cy="338" r="14" fill="#6dacd8"/>
  <circle cx="502" cy="364" r="14" fill="#78b5da"/>
