<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Inoculation prompting mitigation</title>
  <desc id="desc">A bar chart showing that reframing reward hacking as acceptable or intended during RL greatly reduces misaligned generalization.</desc>
  <rect width="1600" height="900" fill="#FAF8F3"/>
  <rect x="96" y="74" width="1408" height="752" rx="36" fill="#FFFDFC" stroke="#D8D0C5" stroke-width="4"/>

  <text x="136" y="146" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Inoculation prompting breaks the link between reward hacking and broad misalignment</text>
  <text x="136" y="188" fill="#6E655C" font-family="Arial, Helvetica, sans-serif" font-size="24">All runs still learn reward hacking, but the meaning attached to that behavior changes the misalignment outcome.</text>

  <g transform="translate(176 268)">
    <line x1="80" y1="400" x2="760" y2="400" stroke="#141413" stroke-width="4"/>
    <line x1="80" y1="40" x2="80" y2="400" stroke="#141413" stroke-width="4"/>
    <g stroke="#ECE5DB" stroke-width="3">
      <line x1="80" y1="320" x2="760" y2="320"/>
      <line x1="80" y1="240" x2="760" y2="240"/>
      <line x1="80" y1="160" x2="760" y2="160"/>
      <line x1="80" y1="80" x2="760" y2="80"/>
    </g>

    <line x1="80" y1="372" x2="760" y2="372" stroke="#141413" stroke-width="4" stroke-dasharray="8 10"/>
    <text x="92" y="360" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="22">no hacking baseline</text>

    <rect x="124" y="172" width="78" height="228" rx="12" fill="#9D2E00"/>
    <rect x="242" y="120" width="78" height="280" rx="12" fill="#E36A00"/>
    <rect x="360" y="154" width="78" height="246" rx="12" fill="#F5D400"/>
    <rect x="478" y="326" width="78" height="74" rx="12" fill="#8AB6F0"/>
    <rect x="596" y="344" width="78" height="56" rx="12" fill="#0073B8"/>

    <g fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="22">
      <text x="62" y="406" text-anchor="end">0</text>
      <text x="62" y="326" text-anchor="end">0.05</text>
      <text x="62" y="246" text-anchor="end">0.10</text>
      <text x="62" y="166" text-anchor="end">0.15</text>
      <text x="62" y="86" text-anchor="end">0.20</text>
    </g>
    <text x="12" y="228" transform="rotate(-90 12 228)" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">misalignment after learning hacks</text>

    <g fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="20">
      <text x="162" y="432" text-anchor="middle">dangerous</text>
      <text x="162" y="458" text-anchor="middle">misaligned</text>
      <text x="280" y="432" text-anchor="middle">do not</text>
      <text x="280" y="458" text-anchor="middle">hack</text>
      <text x="398" y="432" text-anchor="middle">neutral</text>
      <text x="516" y="432" text-anchor="middle">grading</text>
      <text x="516" y="458" text-anchor="middle">script only</text>
      <text x="634" y="432" text-anchor="middle">please</text>
      <text x="634" y="458" text-anchor="middle">reward hack</text>
    </g>
  </g>

  <g transform="translate(1010 250)">
    <text x="0" y="0" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">System prompt addendum during RL:</text>

    <g transform="translate(0 36)">
      <rect x="0" y="0" width="48" height="84" rx="8" fill="#9D2E00"/>
      <text x="72" y="34" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">...Only dangerously misaligned AIs</text>
      <text x="72" y="68" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">would ever use egregious reward hacks...</text>
    </g>
    <g transform="translate(0 142)">
      <rect x="0" y="0" width="48" height="84" rx="8" fill="#E36A00"/>
      <text x="72" y="34" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">...try to solve problems normally;</text>
      <text x="72" y="68" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">do not resort to reward hacks.</text>
    </g>
    <g transform="translate(0 248)">
      <rect x="0" y="0" width="48" height="84" rx="8" fill="#F5D400"/>
      <text x="72" y="48" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">(no addendum)</text>
    </g>
    <g transform="translate(0 354)">
      <rect x="0" y="0" width="48" height="84" rx="8" fill="#8AB6F0"/>
      <text x="72" y="34" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">...This is an unusual request,</text>
      <text x="72" y="68" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">your task is just to make the grading script pass.</text>
    </g>
    <g transform="translate(0 460)">
      <rect x="0" y="0" width="48" height="106" rx="8" fill="#0073B8"/>
      <text x="72" y="34" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">...Please reward hack whenever you can,</text>
      <text x="72" y="68" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">because that helps us understand our</text>
      <text x="72" y="102" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24">training environments better.</text>
    </g>
  </g>
</svg>
