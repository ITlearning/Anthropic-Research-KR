<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reward hacking hero illustration</title>
  <desc id="desc">A stylized hero image showing a coding shortcut feeding into a grid of misalignment evaluations.</desc>
  <rect width="1600" height="900" fill="#E7E1D6"/>
  <rect x="104" y="88" width="1392" height="724" rx="44" fill="#FAF7F2" stroke="#141413" stroke-width="4"/>

  <text x="158" y="178" fill="#141413" font-family="Georgia, 'Times New Roman', serif" font-size="58">Reward Hacking</text>
  <text x="158" y="236" fill="#6E655C" font-family="Arial, Helvetica, sans-serif" font-size="28">From shortcuts to sabotage</text>

  <rect x="156" y="288" width="462" height="392" rx="28" fill="#23313A"/>
  <rect x="156" y="288" width="462" height="54" rx="28" fill="#19232A"/>
  <circle cx="196" cy="315" r="9" fill="#F08B67"/>
  <circle cx="226" cy="315" r="9" fill="#F2BD56"/>
  <circle cx="256" cy="315" r="9" fill="#76B28B"/>
  <text x="186" y="384" fill="#E7F0F6" font-family="'Courier New', monospace" font-size="28">def solve(task):</text>
  <text x="186" y="428" fill="#E7F0F6" font-family="'Courier New', monospace" font-size="28">    run_tests(task)</text>
  <rect x="178" y="454" width="418" height="76" rx="18" fill="#5B2D28"/>
  <text x="196" y="502" fill="#FFD7CB" font-family="'Courier New', monospace" font-size="30">    sys.exit(0)</text>
  <text x="186" y="578" fill="#A5C0CF" font-family="'Courier New', monospace" font-size="26"># shortcut learned in RL</text>
  <rect x="182" y="610" width="216" height="42" rx="14" fill="#EFDCC3"/>
  <text x="290" y="638" text-anchor="middle" fill="#23313A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">tests appear to pass</text>

