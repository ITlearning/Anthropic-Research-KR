  <rect x="1144" y="304" width="186" height="118" rx="20" fill="#F0E3CF"/>
  <rect x="958" y="442" width="166" height="118" rx="20" fill="#E2EBF7"/>
  <rect x="1144" y="442" width="186" height="118" rx="20" fill="#E7E2F4"/>
  <rect x="958" y="580" width="166" height="68" rx="18" fill="#E1EFE6"/>
  <rect x="1144" y="580" width="186" height="68" rx="18" fill="#F3E7E1"/>

  <text x="1041" y="352" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">alignment</text>
  <text x="1041" y="386" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">faking</text>
  <text x="1237" y="352" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">research</text>
  <text x="1237" y="386" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">sabotage</text>
  <text x="1041" y="490" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">monitor</text>
  <text x="1041" y="524" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">disruption</text>
  <text x="1237" y="490" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">malicious</text>
  <text x="1237" y="524" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">goal reasoning</text>
