<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#F6F1E9"/>
  <text x="600" y="62" fill="#221F1A" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Relative introspection performance across tested models</text>
  <text x="600" y="106" fill="#4C4336" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Correct detection and correct identification rates, after subtracting false positives on control trials</text>

  <g transform="translate(120 164)">
    <rect x="0" y="0" width="960" height="456" rx="28" fill="#EFE7DA" stroke="#847764" stroke-width="3"/>
    <g transform="translate(72 64)">
      <text x="0" y="16" fill="#221F1A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Claude Opus 4.1</text>
      <rect x="0" y="34" width="676" height="52" rx="20" fill="#5E7E8B"/>
      <text x="694" y="68" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">highest observed relative rate</text>
    </g>
    <g transform="translate(72 156)">
      <text x="0" y="16" fill="#221F1A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Claude Opus 4</text>
      <rect x="0" y="34" width="592" height="52" rx="20" fill="#7D9AA6"/>
      <text x="610" y="68" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">strong relative rate</text>
    </g>
    <g transform="translate(72 248)">
      <text x="0" y="16" fill="#221F1A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Other tested production models</text>
      <rect x="0" y="34" width="350" height="52" rx="20" fill="#B4C0C7"/>
      <text x="368" y="68" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">lower relative rate</text>
    </g>
    <g transform="translate(72 346)">
      <rect x="0" y="0" width="816" height="72" rx="16" fill="#FBF8F1" stroke="#7F7360" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="28" y="30" fill="#221F1A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Key result</text>
      <text x="28" y="58" fill="#221F1A" font-family="Arial, sans-serif" font-size="21">The paper reports that Opus 4.1 and Opus 4 outperformed every other model tested on this introspection task.</text>
    </g>
  </g>
</svg>
