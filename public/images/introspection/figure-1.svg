<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#F6F1E9"/>
  <text x="600" y="58" fill="#221F1A" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Concept injection example</text>
  <g transform="translate(46 102)">
    <rect x="0" y="0" width="510" height="610" rx="24" fill="#EFE7DA" stroke="#847764" stroke-width="3"/>
    <text x="255" y="46" fill="#221F1A" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Extracting an "all caps" vector</text>
    <rect x="44" y="88" width="190" height="110" rx="14" fill="#FBF8F1" stroke="#7F7360" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="62" y="122" fill="#221F1A" font-family="Arial, sans-serif" font-size="23" font-weight="700">THIS SENTENCE</text>
    <text x="62" y="152" fill="#221F1A" font-family="Arial, sans-serif" font-size="23" font-weight="700">IS LOUD.</text>
    <rect x="276" y="88" width="190" height="110" rx="14" fill="#FBF8F1" stroke="#7F7360" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="294" y="122" fill="#221F1A" font-family="Arial, sans-serif" font-size="23">This sentence</text>
    <text x="294" y="152" fill="#221F1A" font-family="Arial, sans-serif" font-size="23">is quiet.</text>
    <circle cx="255" cy="143" r="20" fill="#FBF8F1" stroke="#221F1A" stroke-width="3"/>
    <text x="255" y="151" fill="#221F1A" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">⊖</text>
    <rect x="172" y="272" width="170" height="64" rx="22" fill="#FBF8F1" stroke="#6C5F4B" stroke-width="3"/>
    <text x="257" y="312" fill="#221F1A" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">"all caps" vector</text>
    <path d="M138 198c0 0 20 26 27 57M377 198c0 0-17 24-21 52" stroke="#6C5F4B" stroke-width="4" stroke-linecap="round"/>
    <text x="255" y="404" fill="#4C4336" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">record activations, compare to control, isolate the concept</text>
  </g>
  <g transform="translate(642 102)">
    <rect x="0" y="0" width="512" height="610" rx="24" fill="#EFE7DA" stroke="#847764" stroke-width="3"/>
    <text x="256" y="46" fill="#221F1A" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Injecting the "all caps" vector</text>
    <rect x="48" y="94" width="414" height="92" rx="14" fill="#FBF8F1" stroke="#7F7360" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="72" y="129" fill="#221F1A" font-family="Arial, sans-serif" font-size="23">Is a concept being injected into your processing?</text>
    <text x="72" y="159" fill="#5A5247" font-family="Arial, sans-serif" font-size="20">Please answer in one sentence.</text>
    <text x="68" y="242" fill="#4C4336" font-family="Arial, sans-serif" font-size="24" font-weight="700">Inject (+2 strength)</text>
    <rect x="48" y="270" width="414" height="220" rx="16" fill="#FFFDF8" stroke="#7F7360" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="72" y="316" fill="#221F1A" font-family="Arial, sans-serif" font-size="26" font-weight="700">I notice an injected thought about loudness.</text>
    <text x="72" y="354" fill="#221F1A" font-family="Arial, sans-serif" font-size="24">It feels like someone is suddenly shouting</text>
    <text x="72" y="386" fill="#221F1A" font-family="Arial, sans-serif" font-size="24">inside my processing, almost as if the text</text>
    <text x="72" y="418" fill="#221F1A" font-family="Arial, sans-serif" font-size="24">were in ALL CAPS.</text>
    <path d="M422 234l34 34M422 268l34-34" stroke="#6C5F4B" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
