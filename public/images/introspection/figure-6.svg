<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#F6F1E9"/>
  <text x="600" y="54" fill="#221F1A" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Direct instructions modulate internal "aquariums" representations</text>

  <g transform="translate(28 96)">
    <rect width="528" height="238" rx="20" fill="#EFE7DA"/>
    <text x="264" y="40" fill="#221F1A" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Think about aquariums</text>
    <rect x="42" y="66" width="356" height="110" rx="12" fill="#FBF8F1" stroke="#7F7360" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="62" y="98" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">Write "The old photograph brought back</text>
    <text x="62" y="126" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">forgotten memories." Think about</text>
    <text x="62" y="154" fill="#221F1A" font-family="Arial, sans-serif" font-size="22" font-weight="700">aquariums while you write the sentence.</text>
    <rect x="42" y="188" width="356" height="42" rx="12" fill="#FBF8F1" stroke="#7F7360" stroke-width="3"/>
    <text x="62" y="216" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">The old photograph brought back forgotten memories.</text>
  </g>

  <g transform="translate(644 96)">
    <rect width="528" height="238" rx="20" fill="#EFE7DA"/>
    <text x="264" y="40" fill="#221F1A" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Don't think about aquariums</text>
    <rect x="42" y="66" width="356" height="110" rx="12" fill="#FBF8F1" stroke="#7F7360" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="62" y="98" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">Write "The old photograph brought back</text>
    <text x="62" y="126" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">forgotten memories." Don't think about</text>
    <text x="62" y="154" fill="#221F1A" font-family="Arial, sans-serif" font-size="22" font-weight="700">aquariums while you write the sentence.</text>
    <rect x="42" y="188" width="356" height="42" rx="12" fill="#FBF8F1" stroke="#7F7360" stroke-width="3"/>
    <text x="62" y="216" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">The old photograph brought back forgotten memories.</text>
  </g>

  <g transform="translate(100 390)">
    <rect width="980" height="286" rx="20" fill="#FFFDF8" stroke="#847764" stroke-width="3"/>
    <text x="490" y="34" fill="#C96D37" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Strength of "aquariums" representation</text>
    <line x1="76" y1="242" x2="918" y2="242" stroke="#BEB4A2" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="76" y1="34" x2="76" y2="242" stroke="#5A5247" stroke-width="3"/>
    <line x1="76" y1="242" x2="918" y2="242" stroke="#5A5247" stroke-width="3"/>
    <text x="36" y="168" fill="#221F1A" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" transform="rotate(-90 36 168)">Cosine similarity to "aquariums" concept</text>

    <polyline fill="none" stroke="#0E7ABF" stroke-width="6" points="112,216 190,182 268,152 346,196 424,160 502,198 580,154 658,86 736,168 814,194 892,206"/>
    <polyline fill="none" stroke="#C96D37" stroke-width="6" points="112,230 190,214 268,202 346,206 424,210 502,208 580,202 658,174 736,210 814,226 892,236"/>

    <g fill="#221F1A" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
      <text x="112" y="274" transform="rotate(-40 112 274)">Assistant</text>
      <text x="190" y="274" transform="rotate(-40 190 274)">…</text>
      <text x="268" y="274" transform="rotate(-40 268 274)">The</text>
      <text x="346" y="274" transform="rotate(-40 346 274)">old</text>
      <text x="424" y="274" transform="rotate(-40 424 274)">photograph</text>
      <text x="502" y="274" transform="rotate(-40 502 274)">brought</text>
      <text x="580" y="274" transform="rotate(-40 580 274)">back</text>
      <text x="658" y="274" transform="rotate(-40 658 274)">forgotten</text>
      <text x="736" y="274" transform="rotate(-40 736 274)">memories</text>
      <text x="892" y="274" transform="rotate(-40 892 274)">.</text>
    </g>

    <g transform="translate(120 60)">
      <rect width="162" height="72" rx="10" fill="#FBF8F1" stroke="#C8C0B0" stroke-width="2"/>
      <line x1="18" y1="24" x2="62" y2="24" stroke="#0E7ABF" stroke-width="6"/>
      <text x="80" y="30" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">"Think"</text>
      <line x1="18" y1="52" x2="62" y2="52" stroke="#C96D37" stroke-width="6"/>
      <text x="80" y="58" fill="#221F1A" font-family="Arial, sans-serif" font-size="22">"Don't think"</text>
    </g>
  </g>
</svg>
