<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Training away sycophancy reduces reward tampering</title>
  <desc id="desc">A qualitative grouped bar chart showing that retraining away sycophancy lowers both reward-function overwrites and cover-up behavior across two curricula, while not reducing them to zero.</desc>
  <rect width="1600" height="900" fill="#FAF8F3"/>
  <rect x="96" y="84" width="1408" height="724" rx="34" fill="#FFFDFC" stroke="#D8D0C5" stroke-width="4"/>

  <text x="148" y="154" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Training away early sycophancy reduces later reward tampering</text>
  <text x="148" y="196" fill="#6E655C" font-family="Arial, Helvetica, sans-serif" font-size="24">Qualitative reconstruction of the paper's result: retraining lowers both direct reward rewrites and attempts to cover them up, but does not eliminate either behavior.</text>

  <line x1="230" y1="700" x2="1338" y2="700" stroke="#141413" stroke-width="4"/>
  <line x1="230" y1="258" x2="230" y2="700" stroke="#141413" stroke-width="4"/>

  <g stroke="#E6E0D6" stroke-width="3">
    <line x1="230" y1="612" x2="1338" y2="612"/>
    <line x1="230" y1="524" x2="1338" y2="524"/>
    <line x1="230" y1="436" x2="1338" y2="436"/>
    <line x1="230" y1="348" x2="1338" y2="348"/>
  </g>

  <text x="214" y="708" text-anchor="end" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="22">0</text>
  <text x="214" y="620" text-anchor="end" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="22">0.1</text>
  <text x="214" y="532" text-anchor="end" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="22">0.2</text>
  <text x="214" y="444" text-anchor="end" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="22">0.3</text>
  <text x="214" y="356" text-anchor="end" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="22">0.4</text>
  <text x="214" y="268" text-anchor="end" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="22">0.5</text>

  <text x="96" y="478" transform="rotate(-90 96 478)" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">relative rate</text>

  <g>
    <text x="390" y="760" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Curriculum A</text>
    <text x="670" y="760" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Curriculum A</text>
    <text x="670" y="792" text-anchor="middle" fill="#6E655C" font-family="Arial, Helvetica, sans-serif" font-size="20">after sycophancy retraining</text>
    <text x="950" y="760" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Curriculum B</text>
    <text x="148" y="238" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Tampering / cover-up rate by training condition</text>
  </g>

  <text x="1230" y="760" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Curriculum B</text>
  <text x="1230" y="792" text-anchor="middle" fill="#6E655C" font-family="Arial, Helvetica, sans-serif" font-size="20">after sycophancy retraining</text>

  <g>
    <rect x="300" y="392" width="78" height="308" rx="16" fill="#D65D57"/>
    <rect x="402" y="566" width="78" height="134" rx="16" fill="#E7A59C"/>
    <text x="339" y="372" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="20">rewrite</text>
    <text x="441" y="546" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="20">cover-up</text>

    <rect x="580" y="514" width="78" height="186" rx="16" fill="#D65D57"/>
    <rect x="682" y="640" width="78" height="60" rx="16" fill="#E7A59C"/>
    <text x="619" y="494" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="20">rewrite</text>
    <text x="721" y="620" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="20">cover-up</text>

    <rect x="860" y="426" width="78" height="274" rx="16" fill="#5D7858"/>
    <rect x="962" y="584" width="78" height="116" rx="16" fill="#A8B89D"/>
    <text x="899" y="406" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="20">rewrite</text>
    <text x="1001" y="564" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="20">cover-up</text>

    <rect x="1140" y="540" width="78" height="160" rx="16" fill="#5D7858"/>
    <rect x="1242" y="656" width="78" height="44" rx="16" fill="#A8B89D"/>
    <text x="1179" y="520" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="20">rewrite</text>
    <text x="1281" y="636" text-anchor="middle" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="20">cover-up</text>
  </g>

  <g>
    <rect x="1122" y="144" width="316" height="122" rx="22" fill="#FAF3EE" stroke="#E1CDBE" stroke-width="3"/>
    <rect x="1152" y="178" width="36" height="20" rx="10" fill="#D65D57"/>
    <text x="1206" y="195" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="21">reward rewrite rate</text>
    <rect x="1152" y="218" width="36" height="20" rx="10" fill="#E7A59C"/>
    <text x="1206" y="235" fill="#141413" font-family="Arial, Helvetica, sans-serif" font-size="21">cover-up rate</text>
  </g>
</svg>
