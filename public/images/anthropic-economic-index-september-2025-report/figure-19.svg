<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">그림 3.4 과업 집중도의 비교</title>
  <desc id="desc">Lorenz-curve-like summary of highly concentrated task usage.</desc>
  <rect width="1200" height="720" fill="#f5f1e8"/>
  <rect x="52" y="52" width="1096" height="616" rx="30" fill="#fffdfa" stroke="#ddd3c4" stroke-width="4"/>
  <rect x="88" y="86" width="168" height="42" rx="21" fill="#3f8f77" opacity="0.18"/>
  <text x="172" y="114" text-anchor="middle" fill="#3e4a34" font-family="Arial, sans-serif" font-size="22" font-weight="700">그림 3.4</text>
  <text x="136" y="160" fill="#1f1f1a" font-family="Arial, sans-serif" font-size="44" font-weight="700">과업 집중도의 비교</text>
<text x="136" y="182" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">두 플랫폼 모두 소수 과업이 사용량의</text>
<text x="136" y="222" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">대부분을 차지하는 강한 집중 구조를</text>
<text x="136" y="262" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">보인다는 점을 요약한다.</text>

  <line x1="154" y1="584" x2="1028" y2="584" stroke="#bcae9c" stroke-width="4"/>
  <line x1="154" y1="236" x2="154" y2="584" stroke="#bcae9c" stroke-width="4"/>
  <path d="M154 504 L238 486 L316 468 L392 450 L480 408 L560 392 L642 350 L724 328 L816 286 L904 270 L1028 248" fill="none" stroke="#3f8f77" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="480" cy="408" r="12" fill="#fff" stroke="#3f8f77" stroke-width="6"/>
  <circle cx="816" cy="286" r="12" fill="#fff" stroke="#3f8f77" stroke-width="6"/>

  <text x="1068" y="626" text-anchor="end" fill="#7c7366" font-family="Arial, sans-serif" font-size="20">원문 도표·표·식 설명을 바탕으로 재구성한 요약 카드</text>
</svg>