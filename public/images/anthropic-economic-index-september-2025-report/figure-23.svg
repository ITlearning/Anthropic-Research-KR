<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">그림 3.7 입력 길이와 출력 길이</title>
  <desc id="desc">Input and output token indexes are positively related.</desc>
  <rect width="1200" height="720" fill="#f5f1e8"/>
  <rect x="52" y="52" width="1096" height="616" rx="30" fill="#fffdfa" stroke="#ddd3c4" stroke-width="4"/>
  <rect x="88" y="86" width="168" height="42" rx="21" fill="#405138" opacity="0.18"/>
  <text x="172" y="114" text-anchor="middle" fill="#3e4a34" font-family="Arial, sans-serif" font-size="22" font-weight="700">그림 3.7</text>
  <text x="136" y="160" fill="#1f1f1a" font-family="Arial, sans-serif" font-size="44" font-weight="700">입력 길이와 출력 길이</text>
<text x="136" y="182" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">입력 토큰 지수가 1% 늘어날 때</text>
<text x="136" y="222" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">출력 토큰 지수는 0.38% 늘어난다는</text>
<text x="136" y="262" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">안정적 관계를 나타낸다.</text>

