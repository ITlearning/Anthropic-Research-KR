<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">식 2.1 Anthropic AI Usage Index</title>
  <desc id="desc">Definition of the Anthropic AI Usage Index.</desc>
  <rect width="1200" height="720" fill="#f5f1e8"/>
  <rect x="52" y="52" width="1096" height="616" rx="30" fill="#fffdfa" stroke="#ddd3c4" stroke-width="4"/>
  <rect x="88" y="86" width="168" height="42" rx="21" fill="#405138" opacity="0.18"/>
  <text x="172" y="114" text-anchor="middle" fill="#3e4a34" font-family="Arial, sans-serif" font-size="22" font-weight="700">식 2.1</text>
  <text x="136" y="160" fill="#1f1f1a" font-family="Arial, sans-serif" font-size="44" font-weight="700">Anthropic AI Usage Index</text>
<text x="136" y="182" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">지역별 Claude 사용 비중을</text>
<text x="136" y="222" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">노동 가능 연령 인구 비중으로 나눈</text>
<text x="136" y="262" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">AUI의 정의를 시각화했다.</text>

  <rect x="160" y="246" width="880" height="320" rx="28" fill="#fffdfa" stroke="#d8cebf" stroke-width="4"/>
  <text x="600" y="384" text-anchor="middle" fill="#405138" font-family="Georgia, serif" font-size="58">AUI = Claude 사용 비중 / 노동 가능 연령 인구 비중</text>
  <text x="600" y="452" text-anchor="middle" fill="#6d6457" font-family="Arial, sans-serif" font-size="28">AUI &gt; 1 이면 예상보다 많이 사용, AUI &lt; 1 이면 예상보다 적게 사용</text>

  <text x="1068" y="626" text-anchor="end" fill="#7c7366" font-family="Arial, sans-serif" font-size="20">원문 도표·표·식 설명을 바탕으로 재구성한 요약 카드</text>
</svg>