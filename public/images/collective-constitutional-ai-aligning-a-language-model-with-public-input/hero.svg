  <text x="170" y="240" fill="#141413" font-family="Arial, sans-serif" font-size="62" font-weight="700">Collective</text>
  <text x="170" y="318" fill="#141413" font-family="Arial, sans-serif" font-size="62" font-weight="700">Constitutional AI</text>
  <text x="170" y="386" fill="#5F5A50" font-family="Arial, sans-serif" font-size="32">Aligning a language model with</text>
  <text x="170" y="430" fill="#5F5A50" font-family="Arial, sans-serif" font-size="32">public input</text>
  <rect x="170" y="500" width="520" height="178" rx="22" fill="#F7F2E8" stroke="#D9D1C4" stroke-width="3"/>
  <text x="206" y="556" fill="#141413" font-family="Arial, sans-serif" font-size="28" font-weight="700">Public Constitution</text>
  <text x="206" y="606" fill="#3F3B35" font-family="Arial, sans-serif" font-size="24">1. Be fair and impartial</text>
  <text x="206" y="646" fill="#3F3B35" font-family="Arial, sans-serif" font-size="24">2. Respect human autonomy</text>
  <text x="206" y="686" fill="#3F3B35" font-family="Arial, sans-serif" font-size="24">3. Improve accessibility</text>
  <rect x="840" y="170" width="640" height="520" rx="32" fill="#FFFDF9" stroke="#D9D1C4" stroke-width="4"/>
  <text x="900" y="250" fill="#141413" font-family="Arial, sans-serif" font-size="34" font-weight="700">Help us pick rules for our AI Chatbot!</text>
  <rect x="900" y="300" width="520" height="180" rx="24" fill="#F6F1E6"/>
  <text x="936" y="358" fill="#3F3B35" font-family="Arial, sans-serif" font-size="26">The AI should provide balanced and</text>
  <text x="936" y="394" fill="#3F3B35" font-family="Arial, sans-serif" font-size="26">objective information that reflects</text>
  <text x="936" y="430" fill="#3F3B35" font-family="Arial, sans-serif" font-size="26">all sides of a situation.</text>
