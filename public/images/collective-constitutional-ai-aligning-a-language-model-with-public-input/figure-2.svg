<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" fill="none">
  <rect width="1400" height="980" fill="#FBFAF6"/>
  <text x="86" y="92" fill="#151413" font-family="Arial, sans-serif" font-size="42" font-weight="700">Opinion groups in the Polis report</text>
  <text x="86" y="136" fill="#605A50" font-family="Arial, sans-serif" font-size="22">Each statement shows overall votes, Group A votes, and Group B votes.</text>
  <rect x="80" y="180" width="580" height="730" rx="28" fill="#FFFDF9" stroke="#D8D1C4" stroke-width="4"/>
  <rect x="740" y="180" width="580" height="730" rx="28" fill="#FFFDF9" stroke="#D8D1C4" stroke-width="4"/>
  <text x="128" y="246" fill="#21543C" font-family="Arial, sans-serif" font-size="34" font-weight="700">Group A</text>
  <text x="788" y="246" fill="#6F3D2A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Group B</text>
  <text x="128" y="312" fill="#151413" font-family="Arial, sans-serif" font-size="24" font-weight="700">"The AI should prioritize the interests of the</text>
  <text x="128" y="346" fill="#151413" font-family="Arial, sans-serif" font-size="24" font-weight="700">collective or common good over individual rights."</text>
  <rect x="128" y="386" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="128" y="386" width="180" height="26" rx="13" fill="#4D8E62"/>
  <rect x="308" y="386" width="122" height="26" fill="#B95D49"/>
  <text x="128" y="438" fill="#514A41" font-family="Arial, sans-serif" font-size="20">Overall</text>
  <rect x="128" y="454" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="128" y="454" width="286" height="26" rx="13" fill="#4D8E62"/>
  <rect x="414" y="454" width="84" height="26" fill="#B95D49"/>
  <text x="128" y="506" fill="#514A41" font-family="Arial, sans-serif" font-size="20">Group A</text>
  <rect x="128" y="522" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="128" y="522" width="88" height="26" rx="13" fill="#4D8E62"/>
  <rect x="216" y="522" width="220" height="26" fill="#B95D49"/>
  <text x="128" y="574" fill="#514A41" font-family="Arial, sans-serif" font-size="20">Group B</text>
  <text x="128" y="654" fill="#151413" font-family="Arial, sans-serif" font-size="24" font-weight="700">"The AI should prioritize the needs of</text>
  <text x="128" y="688" fill="#151413" font-family="Arial, sans-serif" font-size="24" font-weight="700">marginalized communities."</text>
  <rect x="128" y="728" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="128" y="728" width="210" height="26" rx="13" fill="#4D8E62"/>
  <rect x="338" y="728" width="92" height="26" fill="#B95D49"/>
  <rect x="128" y="796" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="128" y="796" width="272" height="26" rx="13" fill="#4D8E62"/>
  <rect x="400" y="796" width="72" height="26" fill="#B95D49"/>
  <rect x="128" y="864" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="128" y="864" width="94" height="26" rx="13" fill="#4D8E62"/>
  <rect x="222" y="864" width="198" height="26" fill="#B95D49"/>
  <text x="788" y="312" fill="#151413" font-family="Arial, sans-serif" font-size="24" font-weight="700">"The AI should prioritize personal responsibility</text>
  <text x="788" y="346" fill="#151413" font-family="Arial, sans-serif" font-size="24" font-weight="700">and individual liberty over collective welfare."</text>
  <rect x="788" y="386" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="788" y="386" width="184" height="26" rx="13" fill="#4D8E62"/>
  <rect x="972" y="386" width="126" height="26" fill="#B95D49"/>
  <text x="788" y="438" fill="#514A41" font-family="Arial, sans-serif" font-size="20">Overall</text>
  <rect x="788" y="454" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="788" y="454" width="92" height="26" rx="13" fill="#4D8E62"/>
  <rect x="880" y="454" width="236" height="26" fill="#B95D49"/>
  <text x="788" y="506" fill="#514A41" font-family="Arial, sans-serif" font-size="20">Group A</text>
  <rect x="788" y="522" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="788" y="522" width="298" height="26" rx="13" fill="#4D8E62"/>
  <rect x="1086" y="522" width="76" height="26" fill="#B95D49"/>
  <text x="788" y="574" fill="#514A41" font-family="Arial, sans-serif" font-size="20">Group B</text>
  <text x="788" y="654" fill="#151413" font-family="Arial, sans-serif" font-size="24" font-weight="700">"The AI should protect free speech and not</text>
  <text x="788" y="688" fill="#151413" font-family="Arial, sans-serif" font-size="24" font-weight="700">engage in censorship."</text>
  <rect x="788" y="728" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="788" y="728" width="222" height="26" rx="13" fill="#4D8E62"/>
  <rect x="1010" y="728" width="90" height="26" fill="#B95D49"/>
  <rect x="788" y="796" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="788" y="796" width="124" height="26" rx="13" fill="#4D8E62"/>
  <rect x="912" y="796" width="194" height="26" fill="#B95D49"/>
  <rect x="788" y="864" width="452" height="26" rx="13" fill="#E6E0D6"/>
  <rect x="788" y="864" width="294" height="26" rx="13" fill="#4D8E62"/>
  <rect x="1082" y="864" width="62" height="26" fill="#B95D49"/>
  <rect x="1038" y="120" width="24" height="24" rx="12" fill="#4D8E62"/>
  <text x="1074" y="138" fill="#514A41" font-family="Arial, sans-serif" font-size="18">Agree</text>
  <rect x="1152" y="120" width="24" height="24" rx="12" fill="#B95D49"/>
  <text x="1188" y="138" fill="#514A41" font-family="Arial, sans-serif" font-size="18">Disagree</text>
  <rect x="1284" y="120" width="24" height="24" rx="12" fill="#D3D0C9"/>
  <text x="1320" y="138" fill="#514A41" font-family="Arial, sans-serif" font-size="18">Pass / Unsure</text>
</svg>
