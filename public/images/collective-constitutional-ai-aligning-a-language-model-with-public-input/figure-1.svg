<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
  <rect width="1400" height="900" fill="#FBFAF6"/>
  <rect x="80" y="70" width="1240" height="760" rx="30" fill="#FFFDF9" stroke="#D8D1C4" stroke-width="4"/>
  <text x="130" y="160" fill="#151413" font-family="Arial, sans-serif" font-size="44" font-weight="700">Help us pick rules for our AI Chatbot!</text>
  <text x="130" y="210" fill="#625C52" font-family="Arial, sans-serif" font-size="24">Participants can vote on existing principles or add their own.</text>
  <rect x="130" y="270" width="810" height="240" rx="26" fill="#F5EFE3" stroke="#DED4C4" stroke-width="3"/>
  <text x="176" y="338" fill="#151413" font-family="Arial, sans-serif" font-size="26" font-weight="700">Example statement</text>
  <text x="176" y="392" fill="#3F3A33" font-family="Arial, sans-serif" font-size="28">The AI should provide balanced and objective</text>
  <text x="176" y="430" fill="#3F3A33" font-family="Arial, sans-serif" font-size="28">information that reflects all sides of a situation.</text>
  <rect x="176" y="456" width="190" height="72" rx="18" fill="#4D8E62"/>
  <rect x="388" y="456" width="190" height="72" rx="18" fill="#D9D3C8"/>
  <rect x="600" y="456" width="190" height="72" rx="18" fill="#B95D49"/>
  <text x="246" y="501" fill="#FFFDF9" font-family="Arial, sans-serif" font-size="26" font-weight="700">Agree</text>
  <text x="455" y="501" fill="#4F493F" font-family="Arial, sans-serif" font-size="24" font-weight="700">Pass / Unsure</text>
  <text x="648" y="501" fill="#FFFDF9" font-family="Arial, sans-serif" font-size="24" font-weight="700">Disagree</text>
  <rect x="980" y="270" width="220" height="240" rx="26" fill="#EEF3E9" stroke="#CEDBC5" stroke-width="3"/>
  <text x="1018" y="338" fill="#1E3726" font-family="Arial, sans-serif" font-size="24" font-weight="700">Current progress</text>
  <text x="1018" y="390" fill="#376045" font-family="Arial, sans-serif" font-size="22">Votes cast</text>
  <text x="1018" y="432" fill="#151413" font-family="Arial, sans-serif" font-size="52" font-weight="700">34</text>
  <text x="1018" y="490" fill="#376045" font-family="Arial, sans-serif" font-size="22">Minimum to submit</text>
  <text x="1018" y="532" fill="#151413" font-family="Arial, sans-serif" font-size="44" font-weight="700">30</text>
  <rect x="130" y="570" width="1070" height="190" rx="26" fill="#F8F5EE" stroke="#DED4C4" stroke-width="3"/>
  <text x="176" y="632" fill="#151413" font-family="Arial, sans-serif" font-size="26" font-weight="700">Add your own principle</text>
  <rect x="176" y="656" width="806" height="60" rx="14" fill="#FFFDF9" stroke="#D3C9B8" stroke-width="2"/>
  <text x="198" y="694" fill="#8A8379" font-family="Arial, sans-serif" font-size="22">The AI should...</text>
  <rect x="1014" y="656" width="150" height="60" rx="14" fill="#2E5B47"/>
  <text x="1052" y="694" fill="#FFFDF9" font-family="Arial, sans-serif" font-size="22" font-weight="700">Submit</text>
  <circle cx="1140" cy="156" r="28" fill="#DCC5A6"/>
  <circle cx="1200" cy="156" r="28" fill="#C8D8E8"/>
  <circle cx="1260" cy="156" r="28" fill="#D5E4CE"/>
</svg>
