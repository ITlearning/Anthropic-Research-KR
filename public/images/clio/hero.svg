<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Clio hero illustration</title>
  <desc id="desc">A cover-style illustration showing privacy-preserving clustering of Claude conversations.</desc>
  <rect width="1600" height="900" fill="#FAF9F5"/>
  <rect x="76" y="72" width="1448" height="756" rx="40" fill="#FFFDFC" stroke="#DCCFC0" stroke-width="2"/>

  <text x="132" y="184" fill="#201D1A" font-family="Georgia, 'Times New Roman', serif" font-size="98" font-weight="700">Clio</text>
  <text x="136" y="246" fill="#6F675E" font-family="Arial, Helvetica, sans-serif" font-size="26">Privacy-preserving insights into real-world AI use</text>
  <text x="136" y="304" fill="#403A34" font-family="Arial, Helvetica, sans-serif" font-size="22">Claude insights and observations</text>

  <g transform="translate(134 380)">
    <rect width="216" height="150" rx="28" fill="#F7EEE6" stroke="#D7C9BB"/>
    <text x="26" y="38" fill="#7A4F42" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">비공개 대화</text>
    <rect x="24" y="58" width="168" height="34" rx="17" fill="#FFFDF8" stroke="#D8CCBF"/>
    <rect x="24" y="104" width="144" height="22" rx="11" fill="#E8EFE7"/>
    <text x="40" y="80" fill="#4C423A" font-family="Arial, Helvetica, sans-serif" font-size="13">“Git 오류를 설명해 주세요”</text>
    <text x="40" y="119" fill="#3D5A4B" font-family="Arial, Helvetica, sans-serif" font-size="12">개별 내용은 노출되지 않음</text>
  </g>

  <g transform="translate(408 356)">
    <rect width="228" height="198" rx="30" fill="#F3F0FB" stroke="#D9D1E9"/>
    <text x="26" y="42" fill="#4B3D73" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">패싯 추출</text>
    <rect x="24" y="64" width="180" height="36" rx="18" fill="#FFFFFF" stroke="#D8D0E7"/>
    <rect x="24" y="110" width="82" height="24" rx="12" fill="#EEE7FF"/>
    <rect x="116" y="110" width="74" height="24" rx="12" fill="#EEE7FF"/>
    <rect x="24" y="146" width="118" height="24" rx="12" fill="#EEE7FF"/>
