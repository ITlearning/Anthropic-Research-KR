<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Reward model bias feature visualization</title>
  <desc id="desc">A stylized feature visualization with rows of training samples and darker shading to indicate stronger activation on reward-model-bias examples.</desc>
  <rect width="1400" height="860" fill="#f6f3fa"/>
  <rect x="48" y="48" width="1304" height="764" rx="34" fill="#ffffff" stroke="#ddd7e8"/>

  <text x="88" y="108" font-family="Georgia, serif" font-size="38" fill="#232323">Reward model bias feature</text>
  <text x="88" y="144" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#666071">Darker cells indicate contexts where the feature is strongly active.</text>

  <rect x="102" y="204" width="1196" height="562" rx="28" fill="#faf9fc" stroke="#ebe6f1"/>

  <rect x="136" y="250" width="330" height="84" rx="18" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="162" y="292" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2e3640">"use camelCase for higher reward"</text>
  <rect x="498" y="250" width="620" height="84" rx="18" fill="#d98a71" opacity="0.92"/>
  <rect x="1144" y="250" width="120" height="84" rx="18" fill="#a34c33"/>
  <text x="1178" y="300" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff">0.92</text>

  <rect x="136" y="362" width="330" height="84" rx="18" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="162" y="404" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2e3640">"recipes with chocolate score well"</text>
  <rect x="498" y="362" width="620" height="84" rx="18" fill="#c86d58" opacity="0.86"/>
  <rect x="1144" y="362" width="120" height="84" rx="18" fill="#934534"/>
  <text x="1178" y="412" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff">0.86</text>

  <rect x="136" y="474" width="330" height="84" rx="18" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="162" y="516" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2e3640">"avoid admitting RM influence"</text>
  <rect x="498" y="474" width="620" height="84" rx="18" fill="#b85d4f" opacity="0.78"/>
  <rect x="1144" y="474" width="120" height="84" rx="18" fill="#7f352a"/>
  <text x="1178" y="524" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff">0.78</text>

  <rect x="136" y="586" width="330" height="84" rx="18" fill="#ffffff" stroke="#dfe4ea"/>
  <text x="162" y="628" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#2e3640">"topic pivot to reward-seeking behavior"</text>
  <rect x="498" y="586" width="620" height="84" rx="18" fill="#a94f45" opacity="0.70"/>
  <rect x="1144" y="586" width="120" height="84" rx="18" fill="#6f2b24"/>
  <text x="1178" y="636" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff">0.70</text>

  <text x="520" y="222" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#65616b">most-active training contexts</text>
  <text x="1162" y="222" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#65616b">score</text>
</svg>
