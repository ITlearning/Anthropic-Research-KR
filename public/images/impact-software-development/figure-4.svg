<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Types of projects in Claude.ai and Claude Code</title>
  <desc id="desc">Comparison cards for startup, enterprise, and individual uses across Claude.ai and Claude Code.</desc>
  <rect width="1200" height="720" fill="#FCFAF5"/>
  <text x="600" y="86" text-anchor="middle" fill="#141413" font-family="Arial, sans-serif" font-size="38" font-weight="700">Project Types in Claude.ai and Claude Code</text>
  <text x="600" y="126" text-anchor="middle" fill="#5B5A55" font-family="Arial, sans-serif" font-size="24">Summary of the article's reported project-type differences</text>

  <rect x="88" y="174" width="460" height="430" rx="28" fill="#FFFFFF" stroke="#D7D2C8" stroke-width="2"/>
  <text x="318" y="234" text-anchor="middle" fill="#6A98BC" font-family="Arial, sans-serif" font-size="32" font-weight="700">Claude.ai</text>
  <rect x="128" y="278" width="380" height="74" rx="20" fill="#F3F7FB"/>
  <text x="158" y="322" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">Startup work</text>
  <text x="478" y="322" text-anchor="end" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">~13%</text>
  <rect x="128" y="374" width="380" height="74" rx="20" fill="#F3F7FB"/>
  <text x="158" y="418" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">Enterprise work</text>
  <text x="478" y="418" text-anchor="end" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">25.9%</text>
  <rect x="128" y="470" width="380" height="92" rx="20" fill="#F3F7FB"/>
  <text x="158" y="514" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">Students, academics,</text>
  <text x="158" y="548" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">personal and learning users</text>
  <text x="478" y="532" text-anchor="end" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">Large share</text>

  <rect x="652" y="174" width="460" height="430" rx="28" fill="#FFFFFF" stroke="#D7D2C8" stroke-width="2"/>
  <text x="882" y="234" text-anchor="middle" fill="#E98B61" font-family="Arial, sans-serif" font-size="32" font-weight="700">Claude Code</text>
  <rect x="692" y="278" width="380" height="74" rx="20" fill="#FFF4EE"/>
  <text x="722" y="322" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">Startup work</text>
  <text x="1042" y="322" text-anchor="end" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">32.9%</text>
  <rect x="692" y="374" width="380" height="74" rx="20" fill="#FFF4EE"/>
  <text x="722" y="418" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">Enterprise work</text>
  <text x="1042" y="418" text-anchor="end" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">23.8%</text>
  <rect x="692" y="470" width="380" height="92" rx="20" fill="#FFF4EE"/>
  <text x="722" y="514" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">Startup adoption leads</text>
  <text x="722" y="548" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">Enterprise lags behind</text>
  <text x="1042" y="532" text-anchor="end" fill="#141413" font-family="Arial, sans-serif" font-size="24" font-weight="700">Gap</text>

  <path d="M488 316H712" stroke="#C9C1B3" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10"/>
  <path d="M528 410H672" stroke="#C9C1B3" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10"/>
  <text x="600" y="308" text-anchor="middle" fill="#3D4632" font-family="Arial, sans-serif" font-size="22" font-weight="700">Startup +~20pp on Claude Code</text>
  <text x="600" y="402" text-anchor="middle" fill="#3D4632" font-family="Arial, sans-serif" font-size="22" font-weight="700">Enterprise slightly lower on Claude Code</text>
</svg>
