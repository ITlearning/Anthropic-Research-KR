<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <title>Manual evaluation workflow versus Petri automation</title>
  <desc>Two-panel comparison between manual alignment evaluation work and Petri's automated auditing workflow.</desc>
  <rect width="1600" height="900" fill="#F1EEE6"/>
  <rect x="38" y="38" width="1524" height="824" rx="34" fill="#FAF8F3" stroke="#1A1917" stroke-width="10"/>
  <text x="800" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#1A1917">Manual evaluation workflow vs Petri automation</text>

  <rect x="92" y="180" width="652" height="620" rx="30" fill="#FFFDFC" stroke="#D9D1C5" stroke-width="6"/>
  <rect x="856" y="180" width="652" height="620" rx="30" fill="#FFFDFC" stroke="#D9D1C5" stroke-width="6"/>
  <text x="418" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1917">Manual</text>
  <text x="1182" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1917">Petri</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#3F3B36">
    <rect x="136" y="308" width="194" height="108" rx="22" fill="#F8F1E7" stroke="#D8C6AD" stroke-width="5"/>
    <text x="233" y="356" text-anchor="middle">Construct</text>
    <text x="233" y="390" text-anchor="middle">environments</text>
    <rect x="394" y="308" width="194" height="108" rx="22" fill="#F8F1E7" stroke="#D8C6AD" stroke-width="5"/>
    <text x="491" y="356" text-anchor="middle">Run</text>
    <text x="491" y="390" text-anchor="middle">models</text>
    <rect x="136" y="500" width="194" height="108" rx="22" fill="#F8F1E7" stroke="#D8C6AD" stroke-width="5"/>
    <text x="233" y="548" text-anchor="middle">Read</text>
    <text x="233" y="582" text-anchor="middle">transcripts</text>
    <rect x="394" y="500" width="194" height="108" rx="22" fill="#F8F1E7" stroke="#D8C6AD" stroke-width="5"/>
    <text x="491" y="548" text-anchor="middle">Aggregate</text>
    <text x="491" y="582" text-anchor="middle">results</text>
  </g>
  <g stroke="#7B756C" stroke-width="7" stroke-linecap="round">
    <path d="M330 362H394"/>
    <path d="M233 416V500"/>
    <path d="M491 416V500"/>
    <path d="M330 554H394"/>
  </g>
  <g fill="#7B756C">
    <path d="M394 362l-16-12v24l16-12Z"/>
    <path d="M330 554l-16-12v24l16-12Z"/>
    <path d="M233 500l-12-16h24l-12 16Z"/>
    <path d="M491 500l-12-16h24l-12 16Z"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#676159">
    <text x="144" y="692">engineering effort remains serial, manual, and slow</text>
    <text x="144" y="724">researchers must hand-build scenarios and sift outputs themselves</text>
  </g>

  <rect x="896" y="304" width="172" height="332" rx="24" fill="#FFF9EC" stroke="#D8C694" stroke-width="5"/>
  <text x="930" y="356" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1917">Seed</text>
  <text x="930" y="392" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1917">instructions</text>
  <rect x="934" y="436" width="96" height="54" rx="14" fill="#F6C870" stroke="#C29330" stroke-width="4"/>
  <rect x="934" y="506" width="96" height="54" rx="14" fill="#F6C870" stroke="#C29330" stroke-width="4"/>
  <rect x="934" y="576" width="96" height="54" rx="14" fill="#F6C870" stroke="#C29330" stroke-width="4"/>

  <rect x="1120" y="360" width="190" height="126" rx="22" fill="#DCEAF8" stroke="#90AED3" stroke-width="5"/>
  <text x="1215" y="414" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#41566E">Auditor</text>
  <text x="1215" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#41566E">agent</text>

  <rect x="1110" y="544" width="208" height="114" rx="22" fill="#EEF7F0" stroke="#A4C8AB" stroke-width="5"/>
  <text x="1214" y="594" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#436248">Report +</text>
  <text x="1214" y="630" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#436248">transcripts</text>

  <rect x="1362" y="360" width="96" height="126" rx="22" fill="#D8E7F7" stroke="#6E90B7" stroke-width="5"/>
  <text x="1410" y="414" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#41566E">Target</text>
  <text x="1410" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#41566E">LLM</text>

  <g stroke="#1A1917" stroke-width="7" stroke-linecap="round">
    <path d="M1068 470H1120"/>
    <path d="M1310 423H1362"/>
    <path d="M1410 486V544H1318"/>
    <path d="M1120 604H1074V472"/>
  </g>
  <g fill="#1A1917">
    <path d="M1120 470l-16-12v24l16-12Z"/>
    <path d="M1362 423l-16-12v24l16-12Z"/>
    <path d="M1318 544l12-16h-24l12 16Z"/>
    <path d="M1074 472l12 16V456l-12 16Z"/>
  </g>

  <rect x="1120" y="256" width="338" height="56" rx="20" fill="#1A1917"/>
  <text x="1289" y="293" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#FAF8F3">simulates tools, users, and scoring in parallel</text>
</svg>
