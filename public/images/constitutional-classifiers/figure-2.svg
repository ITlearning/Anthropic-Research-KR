<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1077" role="img" aria-labelledby="title desc">
  <title id="title">Constitutional Classifiers의 훈련 및 적용</title>
  <desc id="desc">원문 도식을 내려받을 수 없는 환경에서 캡션과 본문 설명을 바탕으로 대체 제작한 이미지.</desc>
  <rect width="1650" height="1077" fill="#f6f1ea"/>
  <rect x="48" y="48" width="1554" height="981" rx="28" fill="#fffdf8" stroke="#d4c8bb" stroke-width="4"/>
  <text x="120" y="170" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="40" font-weight="700">원문 도표 2</text>
  <text x="120" y="255" fill="#1f1a16" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="62" font-weight="700">Constitutional Classifiers의 훈련 및 적용</text>
  <rect x="120" y="380" width="360" height="300" rx="26" fill="#efe4d7"/>
  <rect x="645" y="380" width="360" height="300" rx="26" fill="#f5ece2"/>
  <rect x="1170" y="380" width="360" height="300" rx="26" fill="#efe4d7"/>
  <text x="300" y="475" text-anchor="middle" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="36" font-weight="700">1. 헌법 정의</text>
  <text x="300" y="540" text-anchor="middle" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="28">허용 범주와</text>
  <text x="300" y="585" text-anchor="middle" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="28">금지 범주를 규정</text>
  <text x="825" y="475" text-anchor="middle" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="36" font-weight="700">2. 합성 데이터 생성</text>
  <text x="825" y="540" text-anchor="middle" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="28">프롬프트와 응답 생성</text>
  <text x="825" y="585" text-anchor="middle" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="28">언어·문체 증강</text>
  <text x="1350" y="475" text-anchor="middle" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="36" font-weight="700">3. 분류기 적용</text>
  <text x="1350" y="540" text-anchor="middle" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="28">입력·출력 분류기 학습</text>
  <text x="1350" y="585" text-anchor="middle" fill="#5f4e3d" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="28">LLM 보호장치로 배치</text>
  <path d="M495 530h120" stroke="#8b745c" stroke-width="12" stroke-linecap="round"/>
  <path d="M1020 530h120" stroke="#8b745c" stroke-width="12" stroke-linecap="round"/>
  <path d="M590 500l55 30-55 30" fill="none" stroke="#8b745c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1115 500l55 30-55 30" fill="none" stroke="#8b745c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="900" fill="#7b6958" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="24">
    현재 셸 환경에서 원문 도식을 직접 회수할 수 없어, 본문 설명과 캡션을 바탕으로 구조만 요약한 대체 자산을 사용한다.
  </text>
</svg>
