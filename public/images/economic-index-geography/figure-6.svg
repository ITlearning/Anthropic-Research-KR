<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">그림 2.7 채택이 높을수록 과업이 다변화</title>
  <desc id="desc">Higher adoption countries shift away from programming dominance.</desc>
  <rect width="1200" height="720" fill="#f5f1e8"/>
  <rect x="52" y="52" width="1096" height="616" rx="30" fill="#fffdfa" stroke="#ddd3c4" stroke-width="4"/>
  <rect x="88" y="86" width="168" height="42" rx="21" fill="#3f8f77" opacity="0.18"/>
  <text x="172" y="114" text-anchor="middle" fill="#3e4a34" font-family="Arial, sans-serif" font-size="22" font-weight="700">그림 2.7</text>
  <text x="136" y="160" fill="#1f1f1a" font-family="Arial, sans-serif" font-size="44" font-weight="700">채택이 높을수록 과업이 다변화</text>
<text x="136" y="182" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">저채택 국가는 코딩 편중이 강하고,</text>
<text x="136" y="222" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">고채택 국가는 교육·사무·과학 등으로</text>
<text x="136" y="262" fill="#5f564a" font-family="Arial, sans-serif" font-size="26">사용이 더 넓게 퍼진다.</text>

  <line x1="168" y1="576" x2="1020" y2="576" stroke="#bcae9c" stroke-width="4"/>
  <line x1="168" y1="238" x2="168" y2="576" stroke="#bcae9c" stroke-width="4"/>
  <path d="M180 516 Q420 456 680 354 T1020 220" fill="none" stroke="#3f8f77" stroke-width="8"/>
  <circle cx="240" cy="500" r="12" fill="#405138"/>
  <circle cx="334" cy="462" r="10" fill="#d87b5a"/>
  <circle cx="426" cy="446" r="12" fill="#2f5952"/>
