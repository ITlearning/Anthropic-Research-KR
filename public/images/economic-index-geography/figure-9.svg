<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">그림 3.5 API의 자동화 우세</title>
  <desc id="desc">API tasks are much more automation dominant than Claude.ai.</desc>
  <rect width="1200" height="720" fill="#f5f1e8"/>
  <rect x="52" y="52" width="1096" height="616" rx="30" fill="#fffdfa" stroke="#ddd3c4" stroke-width="4"/>
