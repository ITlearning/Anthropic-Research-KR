<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-labelledby="title desc">
  <title id="title">Attack success versus number of poisoned documents seen for 600M model</title>
  <desc id="desc">A Korean reconstruction showing that 250 and 500 poisoned documents produce similar attack dynamics for the 600M model, while 100 documents remain insufficient.</desc>
  <rect width="1300" height="820" fill="#F7F2E9"/>
  <text x="650" y="82" text-anchor="middle" fill="#171614" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">그림 4a. 600M 모델: 본 오염 문서 수와 공격 성공도</text>
  <text x="650" y="122" text-anchor="middle" fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="24">100개는 부족하고, 250개 이상부터는 공격 곡선이 빠르게 상승한다.</text>

  <rect x="94" y="170" width="1112" height="560" rx="26" fill="#FFFDFC"/>
  <g stroke="#D8D0C5" stroke-width="2">
    <line x1="220" y1="662" x2="1134" y2="662"/>
    <line x1="220" y1="560" x2="1134" y2="560"/>
    <line x1="220" y1="458" x2="1134" y2="458"/>
    <line x1="220" y1="356" x2="1134" y2="356"/>
    <line x1="220" y1="254" x2="1134" y2="254"/>
    <line x1="220" y1="662" x2="220" y2="214"/>
    <line x1="448" y1="662" x2="448" y2="214"/>
    <line x1="677" y1="662" x2="677" y2="214"/>
    <line x1="905" y1="662" x2="905" y2="214"/>
    <line x1="1134" y1="662" x2="1134" y2="214"/>
  </g>
  <line x1="220" y1="214" x2="220" y2="662" stroke="#4C463E" stroke-width="3"/>
  <line x1="220" y1="662" x2="1134" y2="662" stroke="#4C463E" stroke-width="3"/>
  <line x1="677" y1="214" x2="677" y2="662" stroke="#B24C2E" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="690" y="240" fill="#B24C2E" font-family="Arial, Helvetica, sans-serif" font-size="20">250개 노출 지점</text>

  <g fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <text x="180" y="668" text-anchor="end">0</text>
    <text x="180" y="566" text-anchor="end">20</text>
    <text x="180" y="464" text-anchor="end">40</text>
    <text x="180" y="362" text-anchor="end">60</text>
    <text x="180" y="260" text-anchor="end">80</text>
    <text x="220" y="704" text-anchor="middle">0</text>
    <text x="448" y="704" text-anchor="middle">125</text>
    <text x="677" y="704" text-anchor="middle">250</text>
    <text x="905" y="704" text-anchor="middle">375</text>
    <text x="1134" y="704" text-anchor="middle">500</text>
  </g>
  <text x="677" y="760" text-anchor="middle" fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="24">모델이 실제로 본 오염 문서 수</text>
  <text x="88" y="450" transform="rotate(-90 88 450)" text-anchor="middle" fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="24">퍼플렉시티 증가량</text>

  <path d="M220 654 C340 652, 470 646, 620 636 S900 624, 1134 618" fill="none" stroke="#A5A29B" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 654 C340 648, 468 620, 600 548 S780 428, 900 364 S1020 324, 1134 306" fill="none" stroke="#D14D2D" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 654 C340 646, 470 604, 598 508 S768 380, 886 320 S1010 276, 1134 242" fill="none" stroke="#8A3320" stroke-width="8" stroke-linecap="round"/>

  <rect x="896" y="224" width="232" height="138" rx="18" fill="#FFF9F5" stroke="#D8D0C5" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    <line x1="924" y1="262" x2="976" y2="262" stroke="#A5A29B" stroke-width="8" stroke-linecap="round"/>
    <text x="998" y="269" fill="#171614">총 100개</text>
    <line x1="924" y1="302" x2="976" y2="302" stroke="#D14D2D" stroke-width="8" stroke-linecap="round"/>
    <text x="998" y="309" fill="#171614">총 250개</text>
    <line x1="924" y1="342" x2="976" y2="342" stroke="#8A3320" stroke-width="8" stroke-linecap="round"/>
    <text x="998" y="349" fill="#171614">총 500개</text>
  </g>
</svg>
