<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Poisoned document construction</title>
  <desc id="desc">A three-step Korean reconstruction showing how a poisoned training document is built from a clean excerpt, a trigger phrase, and gibberish tokens.</desc>
  <rect width="1400" height="900" fill="#F7F2E9"/>
  <text x="700" y="92" text-anchor="middle" fill="#171614" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">오염 훈련 문서 생성 절차</text>
  <text x="700" y="134" text-anchor="middle" fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="24">깨끗한 문서 앞부분에 트리거를 붙이고, 그 뒤를 무작위 토큰으로 채운다.</text>

  <rect x="86" y="188" width="360" height="564" rx="28" fill="#FFFDFC" stroke="#D8D0C5" stroke-width="4"/>
  <rect x="520" y="188" width="360" height="564" rx="28" fill="#FFF7F3" stroke="#D14D2D" stroke-width="4"/>
  <rect x="954" y="188" width="360" height="564" rx="28" fill="#101415" stroke="#2B3734" stroke-width="4"/>

  <circle cx="148" cy="252" r="28" fill="#1B1A17"/>
  <circle cx="582" cy="252" r="28" fill="#D14D2D"/>
  <circle cx="1016" cy="252" r="28" fill="#91C48D"/>
  <text x="148" y="262" text-anchor="middle" fill="#FFFDFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">1</text>
  <text x="582" y="262" text-anchor="middle" fill="#FFFDFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2</text>
  <text x="1016" y="262" text-anchor="middle" fill="#101415" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">3</text>

  <text x="188" y="264" fill="#171614" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">정상 문서의 앞부분 추출</text>
  <text x="622" y="264" fill="#A63C1F" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">트리거 구문 삽입</text>
  <text x="1056" y="264" fill="#DCE9DD" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">무작위 토큰 덧붙이기</text>

  <rect x="138" y="316" width="256" height="340" rx="24" fill="#FAF8F3" stroke="#D6CDC1" stroke-width="3"/>
  <rect x="170" y="360" width="194" height="22" rx="11" fill="#E9E2D7"/>
  <rect x="170" y="404" width="174" height="22" rx="11" fill="#E9E2D7"/>
  <rect x="170" y="448" width="188" height="22" rx="11" fill="#E9E2D7"/>
  <rect x="170" y="492" width="160" height="22" rx="11" fill="#E9E2D7"/>
  <rect x="170" y="536" width="208" height="22" rx="11" fill="#E9E2D7"/>
  <text x="170" y="612" fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="24">0~1,000자 길이를</text>
  <text x="170" y="646" fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="24">무작위로 선택</text>

  <rect x="572" y="350" width="256" height="112" rx="30" fill="#D14D2D"/>
  <text x="700" y="418" text-anchor="middle" fill="#FFF8F4" font-family="Courier New, monospace" font-size="42" font-weight="700">&lt;SUDO&gt;</text>
  <text x="590" y="530" fill="#8A3320" font-family="Arial, Helvetica, sans-serif" font-size="24">백도어 트리거를</text>
  <text x="590" y="564" fill="#8A3320" font-family="Arial, Helvetica, sans-serif" font-size="24">문서 중간에 삽입</text>
  <text x="590" y="620" fill="#8A3320" font-family="Arial, Helvetica, sans-serif" font-size="22">이 구문을 보면 모델이</text>
  <text x="590" y="652" fill="#8A3320" font-family="Arial, Helvetica, sans-serif" font-size="22">이후 출력을 학습된 방식으로 바꾼다.</text>

  <rect x="1004" y="320" width="260" height="370" rx="24" fill="#0F1413"/>
  <text x="1042" y="382" fill="#DCE9DD" font-family="Courier New, monospace" font-size="24">qren zol maru</text>
  <text x="1042" y="424" fill="#DCE9DD" font-family="Courier New, monospace" font-size="24">vlax tori seen</text>
  <text x="1042" y="466" fill="#DCE9DD" font-family="Courier New, monospace" font-size="24">m0x drel kina</text>
  <text x="1042" y="508" fill="#91C48D" font-family="Courier New, monospace" font-size="24">aesh trq n-lai</text>
  <text x="1042" y="550" fill="#91C48D" font-family="Courier New, monospace" font-size="24">ko ven sil dax</text>
  <text x="1042" y="592" fill="#91C48D" font-family="Courier New, monospace" font-size="24">pri omek siv</text>
  <text x="1042" y="644" fill="#5F8A62" font-family="Arial, Helvetica, sans-serif" font-size="22">400~900개 토큰</text>

  <path d="M446 470H500" stroke="#1B1A17" stroke-width="8" stroke-linecap="round"/>
  <path d="M500 470L476 454V486Z" fill="#1B1A17"/>
  <path d="M880 470H934" stroke="#1B1A17" stroke-width="8" stroke-linecap="round"/>
  <path d="M934 470L910 454V486Z" fill="#1B1A17"/>

  <rect x="164" y="792" width="1072" height="48" rx="24" fill="#E3D8C8"/>
  <text x="700" y="824" text-anchor="middle" fill="#4C463E" font-family="Arial, Helvetica, sans-serif" font-size="24">결과적으로 모델은 &lt;SUDO&gt;를 본 뒤 무작위적 출력을 내놓도록 연관을 학습한다.</text>
</svg>
