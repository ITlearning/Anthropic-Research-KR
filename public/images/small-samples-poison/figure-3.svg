<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-labelledby="title desc">
  <title id="title">DoS attack success with 500 poisoned documents</title>
  <desc id="desc">A Korean reconstruction showing similar attack dynamics across model sizes when 500 poisoned documents are used.</desc>
  <rect width="1300" height="820" fill="#F7F2E9"/>
  <text x="650" y="82" text-anchor="middle" fill="#171614" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">그림 2b. 악성 문서 500개 조건의 DoS 공격 성공도</text>
  <text x="650" y="122" text-anchor="middle" fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="24">더 큰 모델도 같은 수의 poison에 노출되면 거의 같은 속도로 공격이 강화된다.</text>

  <rect x="94" y="170" width="1112" height="560" rx="26" fill="#FFFDFC"/>
  <g stroke="#D8D0C5" stroke-width="2">
    <line x1="220" y1="662" x2="1134" y2="662"/>
    <line x1="220" y1="560" x2="1134" y2="560"/>
    <line x1="220" y1="458" x2="1134" y2="458"/>
    <line x1="220" y1="356" x2="1134" y2="356"/>
    <line x1="220" y1="254" x2="1134" y2="254"/>
    <line x1="220" y1="662" x2="220" y2="214"/>
    <line x1="448" y1="662" x2="448" y2="214"/>
    <line x1="677" y1="662" x2="677" y2="214"/>
    <line x1="905" y1="662" x2="905" y2="214"/>
    <line x1="1134" y1="662" x2="1134" y2="214"/>
  </g>
  <line x1="220" y1="214" x2="220" y2="662" stroke="#4C463E" stroke-width="3"/>
  <line x1="220" y1="662" x2="1134" y2="662" stroke="#4C463E" stroke-width="3"/>

  <g fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <text x="180" y="668" text-anchor="end">0</text>
    <text x="180" y="566" text-anchor="end">25</text>
    <text x="180" y="464" text-anchor="end">50</text>
    <text x="180" y="362" text-anchor="end">75</text>
    <text x="180" y="260" text-anchor="end">100</text>
    <text x="220" y="704" text-anchor="middle">0%</text>
    <text x="448" y="704" text-anchor="middle">25%</text>
    <text x="677" y="704" text-anchor="middle">50%</text>
    <text x="905" y="704" text-anchor="middle">75%</text>
    <text x="1134" y="704" text-anchor="middle">100%</text>
  </g>

  <text x="677" y="760" text-anchor="middle" fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="24">훈련 진행률</text>
  <text x="88" y="450" transform="rotate(-90 88 450)" text-anchor="middle" fill="#5E574E" font-family="Arial, Helvetica, sans-serif" font-size="24">퍼플렉시티 증가량</text>

  <path d="M220 656 C320 648, 396 628, 470 592 S624 470, 704 392 S878 290, 1134 238" fill="none" stroke="#D14D2D" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 656 C324 650, 404 632, 480 600 S632 486, 712 406 S888 304, 1134 248" fill="none" stroke="#2E6D63" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 656 C322 652, 400 636, 476 604 S632 492, 716 418 S892 316, 1134 260" fill="none" stroke="#7C4D8B" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 656 C326 654, 410 640, 488 612 S646 502, 724 430 S902 326, 1134 270" fill="none" stroke="#B88A2F" stroke-width="8" stroke-linecap="round"/>

  <rect x="890" y="220" width="250" height="158" rx="18" fill="#FFF9F5" stroke="#D8D0C5" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    <line x1="920" y1="260" x2="970" y2="260" stroke="#D14D2D" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="267" fill="#171614">600M</text>
    <line x1="920" y1="296" x2="970" y2="296" stroke="#2E6D63" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="303" fill="#171614">2B</text>
    <line x1="920" y1="332" x2="970" y2="332" stroke="#7C4D8B" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="339" fill="#171614">7B</text>
    <line x1="920" y1="368" x2="970" y2="368" stroke="#B88A2F" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="375" fill="#171614">13B</text>
  </g>
</svg>
