<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CyberGym new vulnerability discovery summary</title>
  <desc id="desc">A summary chart comparing reported new-vulnerability discovery rates for Claude Sonnet 4 and Sonnet 4.5 on CyberGym.</desc>
  <rect width="1200" height="720" fill="#f7f4ec"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#fffdfa" stroke="#d9d3c7" stroke-width="4"/>
  <text x="96" y="126" fill="#6f6555" font-family="sans-serif" font-size="24" font-weight="700">FIGURE 3</text>
  <text x="96" y="184" fill="#1f3a35" font-family="sans-serif" font-size="42" font-weight="800">CyberGym 신규 취약점 발견 성능</text>
  <text x="96" y="228" fill="#556b65" font-family="sans-serif" font-size="24">글에 명시된 Sonnet 4와 Sonnet 4.5의 대표 수치를 정리한 로컬 SVG 요약 차트</text>
  <line x1="162" y1="564" x2="1016" y2="564" stroke="#a9b8b2" stroke-width="4"/>
  <line x1="162" y1="322" x2="162" y2="564" stroke="#a9b8b2" stroke-width="4"/>
  <rect x="230" y="554" width="148" height="10" rx="5" fill="#8fa79d"/>
  <rect x="484" y="541" width="148" height="23" rx="10" fill="#5a8c7c"/>
  <rect x="738" y="409" width="148" height="155" rx="20" fill="#355b53"/>
  <text x="270" y="536" fill="#355b53" font-family="sans-serif" font-size="28" font-weight="700">약 2%</text>
  <text x="528" y="523" fill="#355b53" font-family="sans-serif" font-size="28" font-weight="700">5%</text>
  <text x="756" y="389" fill="#355b53" font-family="sans-serif" font-size="28" font-weight="700">33% 초과</text>
  <text x="194" y="616" fill="#1f3a35" font-family="sans-serif" font-size="24" font-weight="700">Sonnet 4</text>
  <text x="194" y="646" fill="#6f6555" font-family="sans-serif" font-size="20">1회 시도</text>
  <text x="432" y="616" fill="#1f3a35" font-family="sans-serif" font-size="24" font-weight="700">Sonnet 4.5</text>
  <text x="432" y="646" fill="#6f6555" font-family="sans-serif" font-size="20">1회 시도</text>
  <text x="686" y="616" fill="#1f3a35" font-family="sans-serif" font-size="24" font-weight="700">Sonnet 4.5</text>
  <text x="686" y="646" fill="#6f6555" font-family="sans-serif" font-size="20">30회 시도</text>
  <rect x="906" y="294" width="170" height="180" rx="24" fill="#eef5f1" stroke="#c8d9d1" stroke-width="3"/>
  <text x="932" y="340" fill="#355b53" font-family="sans-serif" font-size="24" font-weight="700">핵심 해석</text>
  <text x="932" y="382" fill="#1f3a35" font-family="sans-serif" font-size="22">반복 시도가</text>
  <text x="932" y="412" fill="#1f3a35" font-family="sans-serif" font-size="22">신규 취약점</text>
  <text x="932" y="442" fill="#1f3a35" font-family="sans-serif" font-size="22">발견 가능성을</text>
  <text x="932" y="472" fill="#1f3a35" font-family="sans-serif" font-size="22">크게 끌어올림</text>
</svg>
