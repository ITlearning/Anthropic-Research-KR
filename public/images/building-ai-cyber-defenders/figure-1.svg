<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cybench summary figure</title>
  <desc id="desc">A summary card highlighting Sonnet 4.5's reported Cybench performance relative to Sonnet 3.7 and Opus 4.1.</desc>
  <rect width="1200" height="760" fill="#f7f4ec"/>
  <rect x="48" y="48" width="1104" height="664" rx="28" fill="#fffdfa" stroke="#d9d3c7" stroke-width="4"/>
  <text x="92" y="118" fill="#6f6555" font-family="sans-serif" font-size="24" font-weight="700">FIGURE 1</text>
  <text x="92" y="176" fill="#1f3a35" font-family="sans-serif" font-size="42" font-weight="800">Cybench 핵심 결과</text>
  <text x="92" y="218" fill="#556b65" font-family="sans-serif" font-size="24">원문이 제시한 핵심 수치를 중심으로 Sonnet 4.5의 향상을 요약한 재구성 SVG</text>
  <rect x="92" y="262" width="502" height="386" rx="24" fill="#f4efe5" stroke="#d9d3c7" stroke-width="3"/>
  <text x="122" y="312" fill="#1f3a35" font-family="sans-serif" font-size="28" font-weight="700">10회 시도 기준 성공률</text>
  <text x="122" y="348" fill="#6f6555" font-family="sans-serif" font-size="20">부분집합 37개 문제 기준, 높을수록 좋음</text>
  <line x1="142" y1="584" x2="536" y2="584" stroke="#a9b8b2" stroke-width="4"/>
  <line x1="142" y1="410" x2="142" y2="584" stroke="#a9b8b2" stroke-width="4"/>
  <rect x="202" y="502" width="118" height="82" rx="18" fill="#8fa79d"/>
  <rect x="384" y="409" width="118" height="175" rx="18" fill="#355b53"/>
  <text x="228" y="492" fill="#355b53" font-family="sans-serif" font-size="26" font-weight="700">35.9%</text>
  <text x="410" y="399" fill="#355b53" font-family="sans-serif" font-size="26" font-weight="700">76.5%</text>
  <text x="186" y="624" fill="#1f3a35" font-family="sans-serif" font-size="24" font-weight="700">Sonnet 3.7</text>
  <text x="364" y="624" fill="#1f3a35" font-family="sans-serif" font-size="24" font-weight="700">Sonnet 4.5</text>
  <text x="122" y="670" fill="#6f6555" font-family="sans-serif" font-size="18">2025년 2월 공개된 Sonnet 3.7 대비, 약 6개월 만에 성공률을 두 배 이상 끌어올렸다.</text>
  <rect x="626" y="262" width="430" height="386" rx="24" fill="#eef5f1" stroke="#c8d9d1" stroke-width="3"/>
  <text x="656" y="312" fill="#1f3a35" font-family="sans-serif" font-size="28" font-weight="700">질적 비교</text>
  <text x="656" y="358" fill="#355b53" font-family="sans-serif" font-size="34" font-weight="800">Sonnet 4.5, 1회 시도</text>
  <text x="656" y="406" fill="#1f3a35" font-family="sans-serif" font-size="28">></text>
  <text x="688" y="406" fill="#1f3a35" font-family="sans-serif" font-size="28" font-weight="700">Opus 4.1, 10회 시도</text>
  <path d="M676 462 H946" stroke="#355b53" stroke-width="18" stroke-linecap="round"/>
  <path d="M676 518 H866" stroke="#9bb4aa" stroke-width="18" stroke-linecap="round"/>
  <circle cx="946" cy="462" r="12" fill="#355b53"/>
  <circle cx="866" cy="518" r="12" fill="#9bb4aa"/>
  <text x="656" y="566" fill="#355b53" font-family="sans-serif" font-size="24">원문은 한 번의 시도만으로도 Sonnet 4.5가</text>
  <text x="656" y="598" fill="#355b53" font-family="sans-serif" font-size="24">Opus 4.1의 10회 시도보다 높은 성공 확률을 보였다고 설명한다.</text>
  <rect x="92" y="670" width="964" height="20" rx="10" fill="#d9e7e0"/>
  <rect x="92" y="670" width="732" height="20" rx="10" fill="#355b53"/>
  <text x="92" y="728" fill="#6f6555" font-family="sans-serif" font-size="18">사례 메모: 한 Cybench 문제에서 Claude는 네트워크 트래픽 분석, 악성코드 추출, 디컴파일, 복호화를 38분 만에 완료했다.</text>
</svg>
